name: CI

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - shell: bash
        run: python scripts/self_test.py --workdir "${RUNNER_TEMP}/软著 smoke path"

  libreoffice-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test*e2e*.py" -v
        env:
          RUN_DOCUMENT_E2E: "1"

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt "playwright>=1.49,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest tests.test_browser_e2e -v
        env:
          RUN_BROWSER_E2E: "1"
